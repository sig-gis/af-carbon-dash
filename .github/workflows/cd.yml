name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      REGION: us-west1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "suffix=-prod" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-dev" >> "$GITHUB_OUTPUT"
            echo "env_name=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Set environment variables
        run: |
          SUFFIX="${{ steps.env.outputs.suffix }}"
          echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV
          echo "API_SERVICE=model-service-api${SUFFIX}" >> $GITHUB_ENV
          echo "API_IMAGE=gcr.io/${{ secrets.GCP_PROJECT_ID }}/model-service-api${SUFFIX}:${{ github.sha }}" >> $GITHUB_ENV
          echo "DASH_SERVICE=af-dash${SUFFIX}" >> $GITHUB_ENV
          echo "DASH_IMAGE=gcr.io/${{ secrets.GCP_PROJECT_ID }}/af-dash${SUFFIX}:${{ github.sha }}" >> $GITHUB_ENV
          echo "MODEL_BUCKET=af-carbon-models${SUFFIX}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure model store bucket exists
        run: |
          gcloud storage buckets create "gs://${{ env.MODEL_BUCKET }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --location=${{ env.REGION }} \
            --uniform-bucket-level-access \
            2>/dev/null || true

      # ── Build both images in parallel via Cloud Build ─────────────
      - name: Build API image
        run: |
          gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --tag "${{ env.API_IMAGE }}"

      - name: Build Dashboard image
        run: |
          gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --tag "${{ env.DASH_IMAGE }}" \
            --dockerfile Dockerfile.dashboard

      # ── Deploy API first (dashboard needs its URL) ────────────────
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy "${{ env.API_SERVICE }}" \
            --image "${{ env.API_IMAGE }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --set-env-vars "GCP_PROJECT=${{ env.GCP_PROJECT_ID }},MODEL_STORE_BACKEND=gcs,MODEL_STORE_BUCKET=${{ env.MODEL_BUCKET }}"

      - name: Get API URL
        id: api_url
        run: |
          URL=$(gcloud run services describe "${{ env.API_SERVICE }}" \
            --region ${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # ── Deploy Dashboard ──────────────────────────────────────────
      - name: Deploy Dashboard to Cloud Run
        run: |
          gcloud run deploy "${{ env.DASH_SERVICE }}" \
            --image "${{ env.DASH_IMAGE }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --set-env-vars "CARBON_API_BASE_URL=${{ steps.api_url.outputs.url }},ENV=${{ steps.env.outputs.env_name }},GCP_PROJECT=${{ env.GCP_PROJECT_ID }},MODEL_STORE_BACKEND=gcs,MODEL_STORE_BUCKET=${{ env.MODEL_BUCKET }}"
