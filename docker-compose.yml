services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates bucket and seeds it with local model files
  minio-seed:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data/models:/seed/models:ro
      - ./conf/base/model_registry.json:/seed/registry.json:ro
      - ./data/FVSVariantMap20210525:/seed/geo:ro
    entrypoint: >
      /bin/sh -c "
        mc alias set store http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing store/af-models &&
        mc cp --recursive /seed/models/ store/af-models/models/ &&
        mc cp /seed/registry.json store/af-models/registry.json &&
        for f in /seed/geo/*.geojson; do
          mc cp $$f store/af-models/geo/FVS_Variants_and_Locations_4326_simplified_full.geojson
        done &&
        echo 'Seed complete' &&
        mc ls store/af-models/ --recursive --summarize
      "

volumes:
  minio_data:
